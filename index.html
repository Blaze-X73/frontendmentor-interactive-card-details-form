<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./css/style.css">
  
  <title>Frontend Mentor | Interactive card details form</title>
</head>
<body>

  <section class="card-image">
    <section class="back">
      <section class="card-image-cvc">000</section>
    </section>
    <section class="front">
      
      <div class="decorations">
        <img class="card-logo" src="./images/card-logo.svg" alt="">

        <section class="card-image-number">0000 0000 0000 0000</section>
        <section class="txt-container">
          <section class="name">JANE APPLESEED</section>
          <section class="date">00/00</section>
        </div>
      </div>

    </section>
  </section>

  <main>
    <section class="card-details">
    <section class="card-name">
      <label for="cardholder name">CARDHOLDER NAME</label>
      <input type="text" placeholder="e.g. Jane Appleseed">
    </section>

    <section class="card-number">
      <label for="card number">CARD NUMBER</label>
      <input type="text" placeholder="e.g. 1234 5678 9123 0000">
    </section>

    <section class="date-and-cvc">
        <label for="expiry date">EXP. DATE (MM/YY)</label>
        <label for="cvc">CVC</label>
      <input type="number" placeholder="MM">
      <input type="number" placeholder="YY">
      <input type="number" placeholder="e.g. 123">
      
    </section>
    </section>

    <button class="confirm-btn">
      Confirm
    </button>
  </main>
  
</body>
</html>
